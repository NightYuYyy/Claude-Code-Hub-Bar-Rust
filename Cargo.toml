[workspace]
resolver = "2"
members = ["crates/cch-core", "src-tauri"]

[workspace.package]
version = "1.1.12"
edition = "2021"
license = "MIT"
authors = ["Claude Code Hub Bar contributors"]
repository = "https://github.com/NightYuYyy/Claude-Code-Hub-Bar-Rust"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
