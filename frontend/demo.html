<!DOCTYPE html>
<html lang="zh-CN" data-theme="liquidGlass">
  <head>
    <meta charset="UTF-8" />
    <title>CCHBar demo harness</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="panel.css" />
    <style>
      body { padding: 16px; background: #11131a; }
      .stage { width: 420px; height: 640px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="panel">
        <header class="panel-header">
          <div class="brand">
            <div class="logo">C</div>
            <div>
              <div class="title">Claude Code Hub</div>
              <div class="subtitle" id="conn-subtitle">已连接</div>
            </div>
          </div>
          <div class="header-actions">
            <button class="icon-btn" id="btn-refresh" title="刷新">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            </button>
            <button class="icon-btn" id="btn-settings" title="设置">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </header>
        <div class="error-banner hidden" id="error-banner"></div>
        <nav class="tabs">
          <div class="tab active" data-tab="dashboard">概览</div>
          <div class="tab" data-tab="leaderboard">排行</div>
          <div class="tab" data-tab="logs">日志</div>
          <div class="tab" data-tab="providers">供应商</div>
        </nav>
        <div class="content">
          <section class="tab-panel active" id="tab-dashboard"></section>
          <section class="tab-panel" id="tab-leaderboard"></section>
          <section class="tab-panel" id="tab-logs"></section>
          <section class="tab-panel" id="tab-providers"></section>
        </div>
        <footer class="panel-footer">
          <span id="footer-status">就绪</span>
          <span class="spacer"></span>
          <span class="mono" id="footer-version">v1.1.12</span>
        </footer>
      </div>
    </div>
    <script src="format.js"></script>
    <script src="render.js"></script>
    <script src="demo-data.js"></script>
    <script>
      const vm = DEMO_VM;
      vm._period = "daily"; vm._scope = "user"; vm._providerGroup = "全部";
      function renderAll() {
        document.getElementById("tab-dashboard").innerHTML = render.dashboard(vm);
        document.getElementById("tab-leaderboard").innerHTML = render.leaderboard(vm);
        document.getElementById("tab-logs").innerHTML = render.logs(vm);
        document.getElementById("tab-providers").innerHTML = render.providers(vm);
      }
      renderAll();
      document.addEventListener("click", (e) => {
        const tab = e.target.closest(".tab");
        if (!tab) return;
        document.querySelectorAll(".tab").forEach((el) => el.classList.toggle("active", el === tab));
        document.querySelectorAll(".tab-panel").forEach((el) => el.classList.toggle("active", el.id === `tab-${tab.dataset.tab}`));
      });
      window.__showTab = (name) => {
        document.querySelectorAll(".tab").forEach((el) => el.classList.toggle("active", el.dataset.tab === name));
        document.querySelectorAll(".tab-panel").forEach((el) => el.classList.toggle("active", el.id === `tab-${name}`));
      };
    </script>
  </body>
</html>
